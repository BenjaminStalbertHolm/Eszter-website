# Bygger sajten och publicerar den på GitHub Pages vid varje push till main.
# Engångsinställning: Settings → Pages → Source: "GitHub Actions".
# Utan egen domän ligger sajten under /<repo-namn>/ – sätt då repo-variabeln
# PATH_PREFIX (Settings → Secrets and variables → Actions → Variables) till t.ex. /Eszter-website/
name: Publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eleventy --pathprefix="${PATH_PREFIX:-/}"
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
